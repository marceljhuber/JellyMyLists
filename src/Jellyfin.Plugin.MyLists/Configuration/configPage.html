<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>My Lists</title></head>
<body>
<div id="MyListsConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
  <div data-role="content"><div class="content-primary">
    <form id="MyListsConfigForm">
      <div class="sectionTitleContainer flex align-items-center">
        <h2 class="sectionTitle">My Lists</h2>
        <a is="emby-linkbutton" class="raised button-alt headerHelpButton" target="_blank" href="../MyLists/">Open My Lists</a>
      </div>
      <div class="checkboxContainer checkboxContainer-withDescription">
        <label class="emby-checkbox-label"><input id="ShowInSidebar" type="checkbox" is="emby-checkbox" /><span>Show My Lists in the sidebar</span></label>
        <div class="fieldDescription checkboxFieldDescription">Requires the File Transformation plugin. Takes effect after a browser reload.</div>
      </div>
      <div class="inputContainer">
        <input id="TmdbApiKey" type="text" is="emby-input" label="TMDB API key (v3, optional)" />
        <div class="fieldDescription">Only needed to import TMDB lists. IMDb, Letterboxd, rules and manual lists need no key.</div>
      </div>
      <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
    </form>
  </div></div>
  <script>
    (function () {
      var id = '8c2b7d54-3e1a-4f6b-9a0d-5b7c1e2f4a63';
      var page = document.querySelector('#MyListsConfigPage');
      page.addEventListener('pageshow', function () {
        ApiClient.getPluginConfiguration(id).then(function (c) {
          page.querySelector('#ShowInSidebar').checked = c.ShowInSidebar !== false;
          page.querySelector('#TmdbApiKey').value = c.TmdbApiKey || '';
        });
      });
      page.querySelector('#MyListsConfigForm').addEventListener('submit', function (e) {
        e.preventDefault();
        ApiClient.getPluginConfiguration(id).then(function (c) {
          c.ShowInSidebar = page.querySelector('#ShowInSidebar').checked;
          c.TmdbApiKey = page.querySelector('#TmdbApiKey').value.trim();
          ApiClient.updatePluginConfiguration(id, c).then(Dashboard.processPluginConfigurationUpdateResult);
        });
        return false;
      });
    })();
  </script>
</div>
</body>
</html>
